name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SmartLogAnalyzer.slnx

      - name: Build
        run: dotnet build SmartLogAnalyzer.slnx --no-restore

      - name: Test
        run: dotnet test SmartLogAnalyzer.slnx --no-build --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t smartlog-analyzer .
